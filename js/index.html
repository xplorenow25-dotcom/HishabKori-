<script>
(function(){
  var q=document.getElementById('q'),tiles=document.querySelectorAll('.tile'),groups=document.querySelectorAll('.tgroup'),em=document.getElementById('empty');
  q.addEventListener('input',function(){
    var v=q.value.trim().toLowerCase(),n=0;
    tiles.forEach(function(c){
      var s=(c.textContent+' '+(c.dataset.k||'')).toLowerCase(),show=!v||s.indexOf(v)>-1;
      c.style.display=show?'':'none';if(show)n++;
    });
    groups.forEach(function(g){var any=false;g.querySelectorAll('.tile').forEach(function(t){if(t.style.display!=='none')any=true;});g.style.display=any?'':'none';});
    em.style.display=n?'none':'block';
  });
  var f=document.getElementById('reqf');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var v=f.querySelector('input').value.trim();
    if(!v)return;
    window.location.href='mailto:'+Hishab.email+'?subject='+encodeURIComponent('Hishab tool request')+'&body='+encodeURIComponent(v);
    f.querySelector('input').value='';
    f.querySelector('button').textContent=Hishab.t('hm.req.ok');
  });
  document.addEventListener('langchange',function(){f.querySelector('button').textContent=Hishab.t('hm.req.btn');});
})();
</script>
