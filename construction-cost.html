<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ফাউন্ডেশন বড় হলে রড বেশি ধরা হয় কেন?","acceptedAnswer":{"@type":"Answer","text":"ভবিষ্যতে তলা বাড়ানোর কথা ভেবে ফাউন্ডেশন বেশি তলার উপযোগী করলে ভিত্তিতে বাড়তি রড লাগে। এই ক্যালকুলেটরে ফাউন্ডেশন পরিকল্পিত তলার চেয়ে যত তলা বেশি, প্রতি বর্গফুটে তত বার ০.৮ কেজি করে রড যোগ হয়।"}},{"@type":"Question","name":"মালামালের দাম কোথা থেকে নেওয়া?","acceptedAnswer":{"@type":"Answer","text":"দামগুলো হিসাব সাইটের ধরে নেওয়া আনুমানিক বাজার গড়। বাজার বদলায়, তাই কেনার আগে স্থানীয় দোকান থেকে দর যাচাই করুন।"}},{"@type":"Question","name":"শ্রমিক খরচ কীভাবে ঠিক করব?","acceptedAnswer":{"@type":"Answer","text":"প্রতি বর্গফুটে সর্বনিম্ন ও সর্বোচ্চ মজুরি লিখুন। ক্যালকুলেটর দুই হারে খরচের পরিসীমা দেখাবে। আসল দর এলাকা ও ঠিকাদারের সঙ্গে চুক্তির ওপর নির্ভর করে।"}},{"@type":"Question","name":"এটি কি ইঞ্জিনিয়ারের নকশার বিকল্প?","acceptedAnswer":{"@type":"Answer","text":"না। বাড়ি বানানোর আগে লাইসেন্সধারী ইঞ্জিনিয়ার দিয়ে নকশা ও কাঠামোর হিসাব করাতে হবে। এই ক্যালকুলেটর শুধু আগাম বাজেটের ধারণা দেয়।"}}]}</script>
