media:
  input: images/blog
  output: /images/blog
content:
  - name: posts
    label: Blog posts
    type: collection
    path: content/blog
    filename: "{primary}.md"
    view:
      primary: slug
      fields: [title, category, date]
      sort: date
      order: desc
    fields:
      - name: slug
        label: Link name (English letters and dashes only, e.g. fdr-interest-tax)
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short summary (shown on Google, 140 to 160 characters)
        type: text
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
      - name: updated
        label: Last updated date (optional)
        type: date
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: tax
              label: Tax
            - name: banking
              label: Banking and savings
            - name: land
              label: Land
            - name: zakat
              label: Zakat
            - name: general
              label: General
      - name: calculator
        label: Related calculator (shows a button at the end)
        type: select
        options:
          values:
            - name: salary-tax
              label: Salary tax
            - name: business-tax
              label: Business tax
            - name: income-tax
              label: Income tax
            - name: loan-emi
              label: Loan EMI
            - name: dps-fdr
              label: DPS and FDR
            - name: zakat
              label: Zakat calculator
            - name: land-converter
              label: Land converter
            - name: taka-in-words
              label: Taka in words
      - name: lang
        label: Language
        type: select
        options:
          values:
            - name: bn
              label: Bangla
            - name: en
              label: English
      - name: image
        label: Cover photo (optional)
        type: image
      - name: author
        label: Author name (optional)
        type: string
      - name: draft
        label: Draft (tick to keep it hidden)
        type: boolean
      - name: body
        label: Article
        type: rich-text
        required: true
