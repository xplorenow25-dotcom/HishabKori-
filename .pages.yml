media:
  input: images/blog
  output: /images/blog
content:
  - name: posts
    label: Blog posts
    type: collection
    path: content/blog
    filename: "{primary}.md"
    view:
      primary: slug
      fields: [title, category, date]
      sort: date
      order: desc
    fields:
      - name: slug
        label: Link name (English letters and dashes only, e.g. fdr-interest-tax)
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short summary (shown on Google, 140 to 160 characters)
        type: text
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
